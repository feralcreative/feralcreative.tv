<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Signing out · feralcreative.tv</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="stylesheet" href="/styles/css/main.css?v=20261112b">
</head>
<body class="tv-page">
  <!-- Where a channel page sends a visitor who signs out, after clearing its own cookie.
       It clears the hub's session before anything else runs, then shows the hub's sign-in
       screen. Without this, the next visit to a channel would come to the hub and go
       straight back signed in. -->
  <div class="login-screen">
    <div class="login-container">
      <img class="login-logo" src="/images/feral-lockup.svg" alt="Feral Creative">
      <h1>feralcreative.tv</h1>
      <p id="signout-text">Signing you out…</p>
      <a id="signout-home" class="email-link-button" href="/" hidden>Sign in</a>
    </div>
  </div>
  <script>
    (async function () {
      const text = document.getElementById("signout-text");
      try {
        const response = await fetch("/api/session", { method: "DELETE", credentials: "same-origin" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        console.log("[AUTH] Signed out of feralcreative.tv");
        location.replace("/");
      } catch (error) {
        console.error("[AUTH] Sign-out failed:", error);
        text.textContent = "Could not sign you out. Check your connection and reload this page.";
      }
    })();
  </script>
</body>
</html>
