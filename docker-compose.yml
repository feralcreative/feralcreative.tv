services:
  # MediaMTX - RTSP to WebRTC/HLS converter
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cats-mediamtx
    restart: unless-stopped
    ports:
      - "127.0.0.1:1935:1935" # OBS publishing from this Mac only
    # Use host.docker.internal to access host's Tailscale routes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CAMERA_USER=${CAMERA_USER}
      - CAMERA_PASS=${CAMERA_PASS}
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - cats-network

  # ONVIF Backend - Camera control proxy
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cats-backend
    restart: unless-stopped
    # Use host.docker.internal to access host's Tailscale routes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - CAMERA_USER=${CAMERA_USER}
      - CAMERA_PASS=${CAMERA_PASS}
      - PORT=3001
      - TEST_MODE=${TEST_MODE:-false}
    volumes:
      - ./data/backend-state:/app/state # feed on/off state
    networks:
      - cats-network

  # Nginx - Serve static frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cats-web
    restart: unless-stopped
    ports:
      # nginx.conf listens on 80; 54999 is the published host port, as in prod.
      - "54999:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./cats.html:/usr/share/nginx/html/cats.html:ro
      - ./channels.js:/usr/share/nginx/html/channels.js:ro
      - ./skyline.html:/usr/share/nginx/html/skyline.html:ro
      - ./admin.html:/usr/share/nginx/html/admin.html:ro
      - ./admin.js:/usr/share/nginx/html/admin.js:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./obs-stream.js:/usr/share/nginx/html/obs-stream.js:ro
      - ./auth.js:/usr/share/nginx/html/auth.js:ro
      - ./config.js:/usr/share/nginx/html/config.js:ro
      - ./onvif-controls.js:/usr/share/nginx/html/onvif-controls.js:ro
      - ./styles:/usr/share/nginx/html/styles:ro
      - ./images:/usr/share/nginx/html/images:ro
    depends_on:
      - mediamtx
      - backend
    networks:
      - cats-network

networks:
  cats-network:
    driver: bridge
