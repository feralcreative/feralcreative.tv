user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # One shared stack: the hub is the default, cats keeps its own viewer.
    map $host $site_index {
        default index.html;
        cats.feralcreative.tv cats.html;
        cats.localhost cats.html;
    }

    server {
        listen 80 default_server;
        server_name feralcreative.tv localhost feralcreative.localhost cats.feralcreative.tv cats.localhost;
        root /usr/share/nginx/html;
        index $site_index;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Serve static files
        location / {
            try_files $uri $uri/ /$site_index;
        }

        # /index.html follows the hostname's home page too.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /$site_index =404;
        }

        # CSS and JS files - short cache for updates
        location ~ \.(css|js)$ {
            add_header Cache-Control "public, max-age=3600";
            expires 1h;
        }

        # Images - longer cache
        location ~ \.(jpg|jpeg|png|gif|ico|svg)$ {
            add_header Cache-Control "public, max-age=86400";
            expires 24h;
        }

        # HTML files - no cache to ensure fresh content
        location ~ \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # HLS endpoints (including low quality streams). /cam_other/ is served
        # from cam_other_video, the audio-stripped copy of the OBS feed.
        location ~ ^/(cam_left|cam_right|cam_top|cam_other|cam_left_low|cam_right_low|cam_top_low)/.*\.m3u8$ {
            rewrite ^/cam_other/(.*)$ /cam_other_video/$1 break;
            proxy_redirect ~^/cam_other_video/(.*)$ $1;
            proxy_pass http://mediamtx:8888;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~ ^/(cam_left|cam_right|cam_top|cam_other|cam_left_low|cam_right_low|cam_top_low)/.*\.(ts|mp4)$ {
            rewrite ^/cam_other/(.*)$ /cam_other_video/$1 break;
            proxy_redirect ~^/cam_other_video/(.*)$ $1;
            proxy_pass http://mediamtx:8888;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            add_header Cache-Control "max-age=10";
        }

        # Optional OBS feed availability (no control API exposed)
        location = /api/streams/other/status {
            proxy_pass http://backend:3001/api/streams/other/status;
            proxy_read_timeout 5s;
            add_header Cache-Control "no-store";
        }

        # On-air state per channel, for the hub
        location = /api/channels {
            proxy_pass http://backend:3001/api/channels;
            proxy_read_timeout 10s;
            add_header Cache-Control "no-store";
        }

        # Feed on/off state (GET is public; PUT requires a verified admin token)
        location /api/feeds {
            proxy_pass http://backend:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store";
        }

        # Feed admin panel
        location = /admin {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /admin.html =404;
        }

        # ONVIF API proxy to backend
        location /api/onvif/ {
            proxy_pass http://backend:3001/api/onvif/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # www.feralcreative.tv -> feralcreative.tv, so Google OAuth only needs one origin
    server {
        listen 80;
        server_name www.feralcreative.tv;
        return 301 https://feralcreative.tv$request_uri;
    }

    # Legacy cats hostname -> cats.feralcreative.tv
    server {
        listen 80;
        server_name cats.feralcreative.co;
        return 301 https://cats.feralcreative.tv$request_uri;
    }

    # www.montclair.tv -> montclair.tv, so Google OAuth only needs one origin
    server {
        listen 80;
        server_name www.montclair.tv;
        return 301 https://montclair.tv$request_uri;
    }

    # montclair.tv: the SKYLINE feed only, same auth and same streams
    server {
        listen 80;
        server_name montclair.tv montclair.localhost;
        root /usr/share/nginx/html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Every page path serves the single-feed page; index.html is not exposed here
        location / {
            try_files $uri /skyline.html;
        }

        location ~ ^/(index|cats|admin)\.html$ {
            return 404;
        }

        location ~ \.(css|js)$ {
            add_header Cache-Control "public, max-age=3600";
            expires 1h;
        }

        location ~ \.(jpg|jpeg|png|gif|ico|svg)$ {
            add_header Cache-Control "public, max-age=86400";
            expires 24h;
        }

        location ~ \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~ ^/cam_other/.*\.m3u8$ {
            rewrite ^/cam_other/(.*)$ /cam_other_video/$1 break;
            proxy_redirect ~^/cam_other_video/(.*)$ $1;
            proxy_pass http://mediamtx:8888;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location ~ ^/cam_other/.*\.(ts|mp4)$ {
            rewrite ^/cam_other/(.*)$ /cam_other_video/$1 break;
            proxy_redirect ~^/cam_other_video/(.*)$ $1;
            proxy_pass http://mediamtx:8888;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            add_header Cache-Control "max-age=10";
        }

        location = /api/streams/other/status {
            proxy_pass http://backend:3001/api/streams/other/status;
            proxy_read_timeout 5s;
            add_header Cache-Control "no-store";
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
