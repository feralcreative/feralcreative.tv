<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>feralcreative.tv</title>
  <meta name="description" content="Feral Creative channels: Cats, Montclair, and the 3D printer.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://feralcreative.tv/">
  <meta property="og:title" content="feralcreative.tv">
  <meta property="og:description" content="Feral Creative channels: Cats, Montclair, and the 3D printer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/css/main.css?v=20261112c">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/config.js?v=4"></script>
  <script src="/auth.js?v=9"></script>
  <script src="/channels.js?v=2" defer></script>
</head>
<body class="tv-page">
  <div id="login-screen" class="login-screen">
    <div class="login-container">
      <img class="login-logo" src="/images/feral-lockup.svg" alt="Feral Creative">
      <h1>feralcreative.tv</h1>
      <p>Sign in with your Google account to see the channels.</p>
      <div id="google-signin-button"></div>
      <div id="error-message" class="error-message"></div>
    </div>
  </div>
  <div id="stream-container" class="tv-shell" style="display: none;">
    <a class="tv-skip-link" href="#channels">Skip to channels</a>
    <header class="tv-header">
      <a href="https://feralcreative.co/"><img src="/images/feral-lockup.svg" alt="Feral Creative"></a>
      <h1>feralcreative.tv</h1>
    </header>
    <main id="channels" class="tv-channels" aria-labelledby="channels-title">
      <h2 id="channels-title" class="sr-only">Channels</h2>
      <ul class="tv-channel-list">
        <li>
          <a class="tv-channel" data-channel="cats" href="https://cats.feralcreative.tv/">
            <h3>Cats</h3>
            <span class="tv-channel-meta">
              <span class="tv-status" data-status>
                <i class="tv-light" aria-hidden="true"></i>
                <span class="tv-status-label">&nbsp;</span>
              </span>
              <span class="tv-channel-domain">cats.feralcreative.tv</span>
            </span>
          </a>
        </li>
        <li>
          <a class="tv-channel" data-channel="montclair" href="https://montclair.tv/">
            <h3>Montclair</h3>
            <span class="tv-channel-meta">
              <span class="tv-status" data-status>
                <i class="tv-light" aria-hidden="true"></i>
                <span class="tv-status-label">&nbsp;</span>
              </span>
              <span class="tv-channel-domain">montclair.tv</span>
            </span>
          </a>
        </li>
        <li>
          <a class="tv-channel" data-channel="3d" href="https://3d.feralcreative.tv/">
            <h3>3D Printer</h3>
            <span class="tv-channel-meta">
              <span class="tv-status" data-status>
                <i class="tv-light" aria-hidden="true"></i>
                <span class="tv-status-label">&nbsp;</span>
              </span>
              <span class="tv-channel-domain">3d.feralcreative.tv</span>
            </span>
          </a>
        </li>
      </ul>
    </main>
    <nav class="tv-dock" aria-label="Account">
      <a href="/admin">Admin</a>
      <button type="button" onclick="auth.signOut()">Sign out</button>
    </nav>
  </div>
  <script>
    // Show only the channels this viewer may watch.
    document.addEventListener("auth:user", (event) => {
      const user = event.detail;
      for (const link of document.querySelectorAll("[data-channel]")) {
        const allowed = user.admin || user.channels.includes(link.dataset.channel);
        link.closest("li").hidden = !allowed;
      }
      document.querySelector('.tv-dock a[href="/admin"]').hidden = !user.admin;
    });

    // On-air lights: poll the backend while the page is open.
    (function () {
      async function refresh() {
        try {
          const response = await fetch("/api/channels", { cache: "no-store" });
          if (!response.ok) return;
          const { channels } = await response.json();
          for (const link of document.querySelectorAll("[data-channel]")) {
            const channel = channels[link.dataset.channel];
            const status = link.querySelector("[data-status]");
            if (!channel || !status) continue;
            status.classList.toggle("is-live", channel.live);
            status.classList.add("is-known");
            status.querySelector(".tv-status-label").textContent = channel.live ? "On air" : "Off air";
          }
        } catch (error) {
          console.error("[CHANNELS] Status refresh failed:", error);
        }
      }
      refresh();
      setInterval(refresh, 15000);
    })();
  </script>
</body>
</html>
