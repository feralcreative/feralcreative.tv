# MediaMTX Configuration for 3 TP-Link C211 Cameras and an optional OBS feed
# https://github.com/bluenviron/mediamtx

# General settings
logLevel: info
logDestinations: [stdout]
logFile: /dev/stdout

# Authentication. Anyone may read; the camera account publishes the OBS feed
# and drives the API (the backend uses it to turn feeds on and off).
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
      - action: playback
  - user: "feralcreative"
    pass: "@NhMM-r*nM_H@hjWeAMZt8j"
    ips: []
    permissions:
      - action: publish
        path: cam_other
      - action: api
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof

# API settings
api: yes
apiAddress: :9997

# Metrics
metrics: yes
metricsAddress: :9998

# WebRTC settings
webrtc: yes
webrtcAddress: :8889
# Allow WebRTC to work through Docker networking
# The browser connects via localhost, so we need to advertise the host's IP
webrtcAdditionalHosts: []
webrtcLocalUDPAddress: :8189
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# HLS settings (fallback for browsers that don't support WebRTC)
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms

# RTSP settings
rtspAddress: :8554
rtspEncryption: "no"
rtspAuthMethods: [basic]

# OBS publishes H.264/AAC here; Docker host port publication is configured separately.
rtmp: yes
rtmpAddress: :1935

# Camera paths - these will be populated from environment variables
paths:
  # LEFT Camera (192.168.1.201)
  cam_left:
    source: rtsp://feralcreative:@NhMM-r*nM_H@hjWeAMZt8j@192.168.1.201:554/stream1
    rtspTransport: tcp
    sourceOnDemand: no

  cam_left_low:
    source: rtsp://feralcreative:@NhMM-r*nM_H@hjWeAMZt8j@192.168.1.201:554/stream2
    rtspTransport: tcp
    sourceOnDemand: no

  # RIGHT Camera (192.168.1.203)
  cam_right:
    source: rtsp://feralcreative:@NhMM-r*nM_H@hjWeAMZt8j@192.168.1.203:554/stream1
    rtspTransport: tcp
    sourceOnDemand: no

  cam_right_low:
    source: rtsp://feralcreative:@NhMM-r*nM_H@hjWeAMZt8j@192.168.1.203:554/stream2
    rtspTransport: tcp
    sourceOnDemand: no

  # TOP Camera (192.168.1.202)
  cam_top:
    source: rtsp://feralcreative:@NhMM-r*nM_H@hjWeAMZt8j@192.168.1.202:554/stream1
    rtspTransport: tcp
    sourceOnDemand: no

  cam_top_low:
    source: rtsp://feralcreative:@NhMM-r*nM_H@hjWeAMZt8j@192.168.1.202:554/stream2
    rtspTransport: tcp
    sourceOnDemand: no

  # SKYLINE: optional USB camera published by OBS, replacing the retired bookshelf cam.
  cam_other:
    source: publisher
    overridePublisher: no
